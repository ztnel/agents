name: E2E live

# Live tier: the developer agent on a real model against the scripted human.
# Costs premium requests, so it runs nightly and on demand, never per PR.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: Model for the developer agent
        default: gpt-6-luna
      scenario:
        description: Scenario under tests/e2e/scenarios
        default: slugify

permissions:
  contents: read

jobs:
  live:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up isolated Copilot home
        run: echo "COPILOT_HOME=$RUNNER_TEMP/copilot-home" >> "$GITHUB_ENV"

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y tmux
          python -m pip install uv
          npm install -g @github/copilot@1.0.108
          curl -fsSL https://github.com/agavra/tuicr/releases/download/v0.28.0/tuicr-0.28.0-x86_64-unknown-linux-gnu.tar.gz \
            | sudo tar xz -C /usr/local/bin tuicr

      - name: Run live end-to-end scenario
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: >-
          uv run --frozen --project skills/_lib python tests/e2e/run_e2e.py --agent copilot
          --model "${{ inputs.model || 'gpt-6-luna' }}" --scenario "${{ inputs.scenario || 'slugify' }}"
          --artifacts "$RUNNER_TEMP/e2e"

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-live
          path: ${{ runner.temp }}/e2e
